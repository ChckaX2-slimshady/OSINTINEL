[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osintenal"
version = "0.1.0"
description = "Open Source Intelligence Sentinel — Autonomous Evidence Intelligence Operating System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[project.scripts]
osintenal = "osintenal.interfaces.cli.main:main"

[tool.setuptools.packages.find]
include = ["osintenal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
