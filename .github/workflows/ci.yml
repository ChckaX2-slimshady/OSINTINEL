name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # doc 09 §7 CI gates: unit + epistemic-invariant + replayed scenario tests.
      # Live adapter smoke tests are network-gated and excluded from default CI.
      - name: Run test suite
        run: pytest -q
      - name: Smoke-run the demo investigation
        run: osintenal verify
      - name: Smoke-run the adapter slice (offline, from cassettes)
        run: osintenal slice
      - name: Smoke-run the memory learning benchmark
        run: osintenal memory
      - name: Smoke-run the image investigation pipeline
        run: osintenal image
      - name: Smoke-run the geospatial narrowing suite
        run: osintenal geo
      - name: Smoke-render the dashboard console
        run: osintenal dashboard --out /tmp/osintenal-dashboard.html
