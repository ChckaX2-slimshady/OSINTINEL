name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # doc 09 §7 CI gates: unit + epistemic-invariant + replayed scenario tests.
      # Live adapter smoke tests are network-gated and excluded from default CI.
      - name: Run test suite
        run: pytest -q
      - name: Smoke-run the demo investigation
        run: osintinel verify
      - name: Smoke-run the adapter slice (offline, from cassettes)
        run: osintinel slice
      - name: Smoke-run the memory learning benchmark
        run: osintinel memory
      - name: Smoke-run the image investigation pipeline
        run: osintinel image
      - name: Smoke-run the geospatial narrowing suite
        run: osintinel geo
      - name: Smoke-render the dashboard console
        run: osintinel dashboard --out /tmp/osintinel-dashboard.html
      - name: Smoke-run the inference gateway (deterministic, offline)
        run: osintinel models
      - name: Smoke-run the embed-tier source-independence guard
        run: osintinel independence
      - name: Smoke-run the reason-tier reasoning demo
        run: osintinel reason
      - name: Smoke-run the Phase 8 self-improvement loop
        run: osintinel improve
      - name: Smoke-run autonomous web research (offline cassette)
        run: osintinel research
      - name: Smoke-run the free infra/threat-intel adapters
        run: osintinel intel
      - name: Smoke-run the free public-records adapters
        run: osintinel records
      - name: Smoke-run the run-history listing
        run: osintinel history
